name: CI

# No runner has a GPU or nvcc: the core is built without `cuda`, the tests
# marked gpu are left out, and the cuda build is type-checked only. Neither
# has a runner the 261003 data the golden tests read.

# A pull request's branch runs once, as the pull request.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # TOMOXIDE_CUDA_SKIP_BUILD skips tomoxide's nvcc compile and link.
  cuda-typecheck:
    name: clippy (cuda, type-check only)
    runs-on: ubuntu-latest
    env:
      TOMOXIDE_CUDA_SKIP_BUILD: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: cuda
      - run: cargo clippy --all-targets --features cuda -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      # QtGui's own libraries, which the offscreen platform loads too.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: env.yaml
          cache-environment: true
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: nextest
        run: cargo nextest run --no-default-features
      # `-F` replaces pyproject.toml's features, `cuda` with them.
      - name: build the core
        run: maturin develop --release -F pyo3/extension-module
      - name: pytest
        run: python -m pytest -rs -m "not gpu and not golden"
        # Every text file and pipe of ours names its encoding: the locale's is cp1252 on Windows.
        env:
          PYTHONWARNDEFAULTENCODING: "1"
