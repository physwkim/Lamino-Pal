name: CI

on:
  pull_request:

jobs:
  diag:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: dtolnay/rust-toolchain@stable
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: env.yaml
          cache-environment: true
      - name: pwsh
        run: |
          where.exe link
          ($env:Path -split ';').Count
          reg query "HKCU\Software\Microsoft\Command Processor" /v AutoRun
          reg query "HKLM\Software\Microsoft\Command Processor" /v AutoRun
          Get-ChildItem "$env:MAMBA_ROOT_PREFIX\condabin"
          exit 0
      - name: micromamba run
        run: |
          micromamba run -n lamino-pal cmd /c "where link & where cl & where maturin"
          micromamba run -n lamino-pal pwsh -NoProfile -c '$p = $env:Path -split \";\"; $p.Count; $p | Select-Object -First 12'
          micromamba run -n lamino-pal pwsh -NoProfile -c 'Get-ChildItem env: | Where-Object Name -match \"^path$\" | Format-List Name'
          exit 0
      - name: hook files
        run: |
          Get-ChildItem "$env:MAMBA_ROOT_PREFIX\condabin" | ForEach-Object { "== $($_.Name)"; Get-Content $_.FullName }
          $s = micromamba shell activate -s cmd.exe -p "$env:MAMBA_ROOT_PREFIX\envs\lamino-pal"
          "== activate script $s"
          Get-Content $s | ForEach-Object { $_.Substring(0, [Math]::Min(400, $_.Length)) }
          exit 0
