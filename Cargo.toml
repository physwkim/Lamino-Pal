[package]
name = "lamino_pal_core"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
# The Python extension. maturin finds pyo3 only through default features;
# `--no-default-features` links no libpython, so nextest runs the Rust modules.
python = ["dep:pyo3", "dep:numpy"]
cuda = ["tomoxide/cuda"]

[dependencies]
tomoxide = { path = "lib/tomoxide/crates/tomoxide", features = ["config"] }
pyo3 = { version = "0.27", features = ["abi3-py312"], optional = true }
numpy = { version = "0.27", optional = true }
rayon = "1.10"
# tomoxide's; numpy 0.27 brings its own 0.17.
ndarray = "0.16"
# Same h5/tiff crates as tomoxide, which reads what bl7c writes.
rust-hdf5 = "0.3.2"
tiff = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace]
# Path dependencies under the root would join this workspace; tomoxide has its own.
exclude = ["lib/tomoxide"]
